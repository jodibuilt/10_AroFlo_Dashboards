<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Users · AroFlo Dashboards · TTS Built</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/img/dashboards-icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <script>
    // Same light/dark choice as the main app (its header switch saves it).
    (function () {
      try {
        var mode = JSON.parse(localStorage.getItem('reporting-theme') || 'null');
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dash-dark', dark);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img class="brand-light" src="/img/tts-logo-dark.svg" alt="TTS Built" width="97" height="22" />
      <img class="brand-dark" src="/img/tts-logo.svg" alt="TTS Built" width="97" height="22" />
      <h1>User Accounts</h1>
    </div>
    <div class="topbar-right">
      <a href="/" class="btn btn-secondary">Back to dashboards</a>
      <button id="logoutBtn" class="btn btn-secondary">Sign out</button>
    </div>
  </header>

  <div class="admin-table-wrap" id="adminRoot">
    <p id="notAuthorized" class="limitation-note" style="display:none;">Not authorized — admin access required.</p>

    <div id="adminContent" style="display:none;">
      <p class="section-note">Create a user, then give them the temporary password yourself — passwords are not emailed.</p>
      <form id="createForm" class="admin-form-row">
        <input id="newUsername" type="text" placeholder="Username" aria-label="Username" required />
        <input id="newDisplayName" type="text" placeholder="Display name" aria-label="Display name" required />
        <input id="newPassword" type="password" placeholder="Temporary password (min 8 chars)" aria-label="Temporary password" required />
        <select id="newRole" aria-label="Role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" class="btn">Create user</button>
      </form>
      <p class="auth-error" id="createError" role="alert"></p>

      <table>
        <thead>
          <tr><th>Username</th><th>Display name</th><th>Role</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
