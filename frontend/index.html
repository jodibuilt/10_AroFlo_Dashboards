<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AroFlo Dashboards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- The icon font, cut down to the icons this app draws (icon_names, in
         alphabetical order): 24 KB instead of the whole set's 3.9 MB. An
         icon is written as its name, so until the font arrives the name is
         what shows — with the whole set that was "table_chart" and
         "space_dashboard" all over the page for seconds on a first visit.
         USING A NEW ICON? Add its name here, or it will print as the word. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=analytics,build,call_merge,check,chevron_left,chevron_right,close,computer,dark_mode,edit,expand_less,expand_more,light_mode,logout,menu,open_in_new,progress_activity,receipt_long,refresh,settings,space_dashboard,table_chart,tune,visibility_off&display=block" rel="stylesheet" />
    <script>
      // Apply the saved light/dark choice before first paint, so a dark-theme
      // user doesn't get a white flash while the app loads. The app takes
      // over from here in src/hooks/useThemeMode.ts.
      (function () {
        try {
          var mode = JSON.parse(localStorage.getItem('reporting-theme') || 'null');
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dash-dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
